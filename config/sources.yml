  - id: localtis
    name: Localtis (Banque des Territoires)
    url: https://www.banquedesterritoires.fr/localtis
  - id: reporterre
    name: Reporterre
    url: https://reporterre.net/
  - id: the_conversation_fr
    name: The Conversation France
    url: https://theconversation.com/fr
  - id: le_moniteur
    name: Le Moniteur
    url: https://www.lemoniteur.fr/
  - id: bank_territoires
    name: Banque des Territoires
    url: https://www.banquedesterritoires.fr/

market_validation_sources:
  # Pour l'automation 4 uniquement
  - id: boamp
    name: BOAMP
    url: https://www.boamp.fr/
  - id: marchesonline
