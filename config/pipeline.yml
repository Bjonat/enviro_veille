# Définition du pipeline (documentation machine-lisible)

name: environment-intelligence
version: "2.0"
goal: >
  Radar du paysage professionnel environnemental français —
  détecter tôt de nouveaux besoins (faire / acheter / mesurer / produire / maîtriser)
  puis distinguer ceux qui deviennent des offres actionnables pour un bureau d'études environnementales.

stages:
  - id: veille_quotidienne
    automation_doc: config/automations/01-veille-quotidienne.md
    schedule: "0 6 * * *"
    role: >
      Collecter, dédupliquer et structurer la veille environnementale quotidienne.
      Cette étape ne produit ni opportunités ni analyse business.
    inputs:
      - config/sources.yml
      - config/themes.yml
      - data/daily/**/*.json  # historique pour déduplication
    outputs:
      - veille/YYYY/MM/YYYY-MM-DD.md
      - data/daily/YYYY/MM/YYYY-MM-DD.json

  - id: orchestrateur_strategique
    automation_doc: config/automations/02-06-orchestrateur-strategique.md
    schedule: "0 7 * * 1"
    depends_on: [veille_quotidienne]
    role: >
      Inspecter l'état réel du repo et reprendre le pipeline au bon endroit.
      Transformer la veille en tendances, opportunités, preuves de marché et offres BE,
      avec continuité longitudinale, scoring calibré, contrôle qualité déterministe
      et une seule PR par cycle.
    inputs:
      - config/pipeline.yml
      - config/themes.yml
      - config/sources.yml
      - config/be-personas.yml
      - config/scoring.yml
      - config/schemas/tendances.schema.json
      - config/schemas/opportunites.schema.json
      - config/schemas/validation.schema.json
      - config/schemas/offres.schema.json
      - data/daily/**/*.json
      - tendances/**/*.json
      - opportunites/**/*.json
      - validation/**/*.json
      - offres/**/*.json
    quality_gate:
      command: python scripts/validate_pipeline.py
      strict_for: schema_version_2.0
      legacy_mode: warnings
    outputs:
      - tendances/YYYY/{period}.md
      - tendances/YYYY/{period}.json
      - opportunites/YYYY/{period}.md
      - opportunites/YYYY/{period}.json
      - validation/YYYY/{period}.md
      - validation/YYYY/{period}.json
      - offres/YYYY/{period}.md
      - offres/YYYY/{period}.json
      - github_pull_request

central_question: >
  Qu'est-ce que les professionnels de l'environnement vont bientôt devoir
  faire, acheter, mesurer, produire ou maîtriser qu'ils ne faisaient pas auparavant ?

be_question: >
  Parmi ces évolutions, lesquelles créent réellement une activité
  qu'un bureau d'études environnementales peut vendre ?

causal_chain:
  - signal_de_veille
  - dynamique
  - nouveau_besoin_professionnel
  - preuve_de_demande
  - offre_be_actionnable

v2_rules:
  artifact_schema_version: "2.0"
  continuity: >
    Toute tendance et opportunité déjà observée conserve un canonical_id stable et explicite
    son évolution par rapport à la période précédente au lieu d'être recréée sous un nouveau nom.
  scoring: config/scoring.yml
  ready_to_prototype: >
    Une obligation réglementaire seule ne suffit pas. Une offre pret_a_prototyper doit disposer
    d'une preuve de demande directe/externalisable et respecter le filtre métier BE.
  deterministic_validation: scripts/validate_pipeline.py

legacy_automation_docs:
  note: >
    Les anciens prompts séparés 02, 03, 04, 05 et 06 sont conservés dans
    config/automations/ comme historique et référence méthodologique, mais ne constituent
    plus le pipeline opérationnel recommandé.
  files:
    - config/automations/02-analyse-tendances.md
    - config/automations/03-detection-opportunites.md
    - config/automations/04-validation-marche.md
    - config/automations/05-validation-pr.md
    - config/automations/06-fiches-offre-be.md
